<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="title desc">
<title id="title">Button Horizon em três contextos</title><desc id="desc">Composições conceituais para AI Workspace, Studio e projetos de template ou protótipo. Todos consomem o mesmo Button Shoreline com o tema Horizon. Não são capturas das aplicações.</desc>
