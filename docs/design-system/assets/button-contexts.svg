<text x="62" y="594" fill="#425269" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">import &#x27;@vtex/shoreline/themes/horizon&#x27;</text>
<text x="62" y="626" fill="#425269" font-size="22" font-weight="400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">&lt;Button variant=&quot;primary&quot;&gt;Ação&lt;/Button&gt;</text>
<text x="40" y="682" fill="#506077" font-size="23" font-weight="400" text-anchor="start">Composições ilustrativas; não representam telas aprovadas ou integração concluída.</text>
