<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Horizon — comparação com Sunrise</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main id="comparison">
      <header>
        <h1 id="title">Button</h1>
      </header>
      <div class="comparison-columns">
        <section><h2>Sunrise</h2><iframe id="sunrise" title="Componentes Sunrise"></iframe></section>
        <section><h2>Horizon</h2><iframe id="horizon" title="Componentes Horizon"></iframe></section>
      </div>
    </main>
    <nav aria-label="Comparações"><a href="?component=button">Button</a><a href="?component=icon-button">IconButton</a></nav>
    <script type="module">
      const component = new URLSearchParams(location.search).get('component') === 'icon-button' ? 'icon-button' : 'button'
      document.querySelector('#title').textContent = component === 'button' ? 'Button' : 'IconButton'
      for (const theme of ['sunrise', 'horizon']) document.querySelector(`#${theme}`).src = `./frame.html?theme=${theme}&component=${component}`
    </script>
  </body>
</html>
